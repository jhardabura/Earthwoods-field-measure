<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Earthwoods | Field Measure</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#21332d;background:#eef1ed}*{box-sizing:border-box}body{margin:0}header{background:#183b31;color:white;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px}header h1{font-size:22px;margin:0}header small{color:#c6d9d0}.layout{display:grid;grid-template-columns:215px minmax(0,1fr);min-height:calc(100vh - 76px)}nav{background:#e0e8e2;padding:20px 12px;display:flex;flex-direction:column;gap:8px}nav button{border:0;background:transparent;text-align:left;padding:15px;border-radius:10px;font-size:16px;color:#244336}nav button.active{background:#fff;font-weight:700;box-shadow:0 1px 4px #0001}main{padding:22px;max-width:1250px;width:100%;margin:auto}.panel{background:white;border:1px solid #d7ded9;border-radius:15px;padding:20px;margin-bottom:16px}.panel h2{margin:0 0 8px;font-size:22px}.panel h3{margin:10px 0;font-size:17px}.muted{color:#63776c;font-size:14px}label{display:block;font-weight:600;font-size:14px;margin:12px 0 5px}input,select,textarea{width:100%;padding:13px;border:1px solid #bdcbc1;border-radius:9px;font:inherit;background:white;color:#1e342a}textarea{min-height:82px}input[type=file]{padding:9px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 20px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}button{font:inherit;cursor:pointer}button.primary,.actions button,.smallbtn{border:1px solid #244c3d;background:#244c3d;color:white;padding:12px 17px;border-radius:9px;font-weight:600}button.secondary{background:white;color:#244c3d}.question{border-bottom:1px solid #e4eae5;padding:13px 0}.question:last-child{border:0}.question-title{font-weight:600;margin-bottom:8px}.choice{display:flex;gap:10px;flex-wrap:wrap}.choice button{border:1px solid #b9cbbf;background:#fff;border-radius:8px;padding:10px 22px;min-width:75px}.choice button.selected{background:#244c3d;color:#fff}.photo{display:inline-flex;flex-direction:column;gap:4px;margin:6px 8px 6px 0;max-width:145px}.photo img{width:140px;height:105px;object-fit:cover;border-radius:7px}.photo button{border:0;background:#f7dfdc;color:#713326;border-radius:6px;padding:6px}.roomtab{display:flex;flex-wrap:wrap;gap:7px;margin:15px 0}.roomtab button{padding:10px 13px;border-radius:8px;border:1px solid #c6d4ca;background:white}.roomtab button.selected{background:#244c3d;color:white}.metric{background:#f1f5f1;border-radius:10px;padding:13px}.metric strong{font-size:24px}.footer{color:#66766d;font-size:12px;margin:15px 0}.warn{background:#fff5df;border:1px solid #f0d59e;padding:12px;border-radius:9px}.good{background:#e5f2e8;padding:12px;border-radius:9px} .hidden{display:none}@media(max-width:720px){.layout{grid-template-columns:1fr}nav{flex-direction:row;overflow:auto;padding:9px;position:sticky;top:0;z-index:2}nav button{white-space:nowrap;padding:11px}main{padding:12px}.grid,.grid3{grid-template-columns:1fr}header{padding:12px}header h1{font-size:18px}}@media print{header,nav,.actions,.no-print,.roomtab{display:none!important}.layout{display:block}main{padding:0}.panel{break-inside:avoid;border:1px solid #bbb}body{background:white}input,textarea,select{border:0;padding:4px}}
</style></head><body><header><div><small>EARTHWOODS CUSTOM CABINETRY</small><h1>Field Measure & Site Survey</h1></div><div id="saved">Offline-ready • Local draft</div></header><div class="layout"><nav id="nav"></nav><main id="main"></main></div><script>
function makeId(){if(typeof crypto!=='undefined' && typeof crypto.randomUUID==='function')return crypto.randomUUID();return 'ew-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)+'-'+Math.random().toString(36).slice(2)}
const key='earthwoods-field-measure-v1';const sections=['Project','Access','Site Conditions','Rooms','Open Items','Review'];const checklist=[
['representative','Was a customer representative present?','Project'],['photosTaken','Were overall site photos taken?','Project'],
['truck','Can the Earthwoods delivery truck get within 100 feet?','Access'],['standardDoor','Is there a standard door for product distribution?','Access'],['stairs','Are there stairs along the product distribution route?','Access'],['constraints','Are there room-specific access constraints?','Access'],
['electrical','Was electrical rough-in complete?','Site Conditions'],['plumbing','Was plumbing rough-in complete?','Site Conditions'],['floorConsistent','Is final flooring consistent throughout?','Site Conditions'],['ceilingConsistent','Are ceiling heights consistent throughout?','Site Conditions'],['soffits','Are there soffits?','Site Conditions'],['windows','Are windows installed?','Site Conditions'],['doors','Are door frames installed?','Site Conditions'] ];
const newRoom=()=>({id:makeId(),name:'New Room',floor:'1',ceiling:'',flooring:'',floorThickness:'',drywall:'',wallFinish:'',wallPlumb:'',cabinetTopVisible:false,cabinetBottomVisible:false,visibilityNotes:'',walls:[{name:'A',length:'',height:'',notes:''}],openings:[],cabinetRuns:[{name:'Run 1',width:'',depth:'',height:'',notes:''}],notes:'',photos:[]});
const initial=()=>({project:{name:'',address:'',date:new Date().toISOString().slice(0,10),measurer:'',salesRep:'',salesPhone:'',contact:'',phone:'',type:'',representativeName:'',notes:''},answers:{},details:{},rooms:[{...newRoom(),name:'Kitchen'}],issues:[],photos:[],questionPhotos:{}});let data;try{data=JSON.parse(localStorage.getItem(key))||initial()}catch{data=initial()}let section='Project',roomId=data.rooms[0]?.id;
const projectsKey='earthwoods-field-measure-projects-v7';let projects={};let activeId='';
try{projects=JSON.parse(localStorage.getItem(projectsKey))||{}}catch{projects={}}
try{activeId=localStorage.getItem(projectsKey+'-active')||''}catch{}
if(activeId&&projects[activeId]){data=projects[activeId];roomId=data.rooms[0]?.id}
else{activeId=makeId();projects[activeId]=data;try{localStorage.setItem(projectsKey+'-active',activeId)}catch{}}
function persistProjects(){try{projects[activeId]=data;localStorage.setItem(projectsKey,JSON.stringify(projects));localStorage.setItem(projectsKey+'-active',activeId);return true}catch{return false}}
function saveAsProject(){const suggested=(data.project.name||'Untitled Project')+' - Copy';const name=prompt('Name for the new project copy:',suggested);if(name===null)return; if(!name.trim()){alert('Enter a project name.');return}const original=activeId;const copy=JSON.parse(JSON.stringify(data));copy.project.name=name.trim();activeId=makeId();data=copy;roomId=data.rooms[0]?.id;if(!persistProjects()){activeId=original;data=projects[original];alert('Not enough browser storage. Download a backup first.');return}section='Project';render();alert('Saved as a separate project. Your original remains available under Projects.')}
function newBlankProject(){if(!confirm('Start a new blank project? Your current project will remain saved on this device.'))return;const original=activeId;const old=data;activeId=makeId();data=initial();roomId=data.rooms[0]?.id;if(!persistProjects()){activeId=original;data=old;alert('Not enough browser storage. Download a backup first.');return}section='Project';render()}
function switchProject(id){if(!projects[id]||id===activeId)return;activeId=id;data=projects[id];roomId=data.rooms[0]?.id;persistProjects();section='Project';render()}
function deleteSavedProject(id){
 if(!projects[id])return;
 const name=projects[id].project?.name||'Untitled Project';
 if(!confirm('Delete "'+name+'" from this device?\n\nThis permanently removes its measurements and photos stored in this browser. Download a backup first if needed.'))return;
 if(id===activeId){
  const others=Object.keys(projects).filter(k=>k!==id);
  if(others.length){activeId=others[0];data=projects[activeId]}
  else{activeId=makeId();data=initial();projects[activeId]=data}
  roomId=data.rooms[0]?.id;
 }
 delete projects[id];
 try{localStorage.setItem(projectsKey,JSON.stringify(projects));localStorage.setItem(projectsKey+'-active',activeId);localStorage.setItem(key,JSON.stringify(data))}catch{alert('Could not save the updated project list. Please check browser storage.')}
 section='Project';render();
}
function projectSelector(){return `<div class="panel no-print"><h2>Saved Projects</h2><p class="muted">Your blank template stays reusable. Each project is saved separately on this browser/device.</p><div class="grid"><div><label>Open saved project</label><select onchange="switchProject(this.value)">${Object.entries(projects).map(([id,p])=>`<option value="${esc(id)}" ${id===activeId?'selected':''}>${esc(p.project?.name||'Untitled Project')} — ${esc(p.project?.address||'No address')}</option>`).join('')}</select></div><div><label>Project actions</label><div class="actions" style="margin:0"><button onclick="newBlankProject()">+ New Blank Project</button><button onclick="saveAsProject()">Save As…</button><button class="secondary" onclick="exportJSON()">Download Backup</button><button style="background:#a33732;border-color:#a33732" onclick="deleteSavedProject(activeId)">Delete Current Project</button></div></div></div><h3>Manage saved projects</h3>${Object.entries(projects).map(([id,p])=>`<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #d7ded9;padding:9px 0"><div><b>${esc(p.project?.name||'Untitled Project')}</b>${id===activeId?' <small>(Open)</small>':''}<br><span class="muted">${esc(p.project?.address||'No address')}</span></div><button class="smallbtn secondary" style="border:1px solid #b84843;color:#a33732" onclick="deleteSavedProject('${id}')">Delete</button></div>`).join('')}<p class="muted">Deletion only affects this browser's local saved projects; downloaded backups and Google Drive copies are not deleted.</p></div>`}

function save(){try{localStorage.setItem(key,JSON.stringify(data));if(!persistProjects())throw Error('Storage full');document.getElementById('saved').textContent='Saved on this device • '+new Date().toLocaleTimeString()}catch{document.getElementById('saved').textContent='Storage full: export project now'}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function field(path,label,type='text',hint=''){const v=get(path);return `<div><label>${label}</label>${type==='textarea'?`<textarea data-path="${path}" placeholder="${esc(hint)}">${esc(v)}</textarea>`:`<input data-path="${path}" type="${type}" value="${esc(v)}" placeholder="${esc(hint)}">`}</div>`}function get(path){return path.split('.').reduce((a,k)=>a?.[k],data)??''}function set(path,value){let p=path.split('.'),o=data;for(let i=0;i<p.length-1;i++)o=o[p[i]];o[p.at(-1)]=value;save()}function question(id,title){const v=data.answers[id]||'';data.questionPhotos??={};data.questionPhotos[id]??=[];return `<div class="question"><div class="question-title">${esc(title)}</div><div class="choice">${['Yes','No','N/A'].map(x=>`<button class="${v===x?'selected':''}" onclick="answer('${id}','${x}')">${x}</button>`).join('')}</div>${v==='Yes'||v==='No'?`<div style="margin-top:8px">${field('details.'+id,'Details / measurements / follow-up','textarea','Describe conditions, dimensions, or constraints')}</div>`:''}${photos(data.questionPhotos[id],'question',id)}</div>`}function answer(id,v){data.answers[id]=v;save();render()}
function photos(arr,kind,id){return `<div class="no-print"><label>Photos</label><div class="actions" style="margin:6px 0 12px"><button type="button" class="smallbtn" onclick="openCamera('${kind}','${id}')">📷 Take Photo</button><label class="smallbtn secondary" style="margin:0;display:inline-flex;align-items:center;gap:8px;cursor:pointer">＋ Upload Photos<input type="file" accept="image/*" multiple style="display:none" onchange="addPhotos(event,'${kind}','${id}')"></label></div></div><div>${arr.map((p,i)=>`<div class="photo"><img src="${p.src}"><small>${esc(p.name)}</small><button class="no-print" onclick="removePhoto('${kind}','${id}',${i})">Remove</button></div>`).join('')}</div>`}function photoList(kind,id){if(kind==='question'){data.questionPhotos??={};return data.questionPhotos[id]??=([])}return kind==='project'?data.photos:kind==='room'?data.rooms.find(r=>r.id===id).photos:data.issues.find(i=>i.id===id).photos}async function addPhotos(e,kind,id){for(const f of [...e.target.files]){const src=await resize(f);photoList(kind,id).push({name:f.name,src})}save();render()}function resize(file){return new Promise((resolve,reject)=>{let im=new Image();im.onload=()=>{let ratio=Math.min(1,1280/Math.max(im.width,im.height));let c=document.createElement('canvas');c.width=Math.round(im.width*ratio);c.height=Math.round(im.height*ratio);c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.62))};im.onerror=reject;im.src=URL.createObjectURL(file)})}function removePhoto(kind,id,i){photoList(kind,id).splice(i,1);save();render()}
function render(){document.getElementById('nav').innerHTML=sections.map(s=>`<button class="${section===s?'active':''}" onclick="go('${s}')">${s}</button>`).join('');let html='';if(section==='Project'){html=projectSelector()+`<div class="panel"><h2>Project Information</h2><p class="muted">Enter job details once. They follow every room and the final report.</p><div class="grid">${field('project.name','Project name')}${field('project.address','Site address')}${field('project.date','Measure date','date')}${field('project.measurer','Field measurer')}${field('project.salesRep','Sales representative')}${field('project.salesPhone','Sales rep phone','tel')}${field('project.contact','Site contact')}${field('project.phone','Site contact phone','tel')}${field('project.type','Project type (new build / remodel)')}${field('project.representativeName','Representative present — name')}</div>${checklist.filter(q=>q[2]==='Project').map(q=>question(...q.slice(0,2))).join('')}${field('project.notes','General project notes','textarea')}${photos(data.photos,'project','')}</div>`}
else if(section==='Access'){html=`<div class="panel"><h2>Jobsite Access</h2><p class="muted">Document delivery and installation constraints.</p>${checklist.filter(q=>q[2]==='Access').map(q=>question(...q.slice(0,2))).join('')}</div>`}
else if(section==='Site Conditions'){html=`<div class="panel"><h2>Jobsite Specific Details</h2>${checklist.filter(q=>q[2]==='Site Conditions').map(q=>question(...q.slice(0,2))).join('')}<div class="grid">${field('details.drywall','Drywall thickness (1/2 or 5/8 in)')}${field('details.firstFloor','1st floor material and thickness')}${field('details.secondFloor','2nd floor material and thickness')}${field('details.firstCeiling','1st floor ceiling height')}${field('details.secondCeiling','2nd floor ceiling height')}${field('details.windowTrim','Window interior and trim type')}${field('details.windowCasing','Window casing width / notes')}${field('details.doorTrim','Door trim type')}${field('details.doorCasing','Door casing width / notes')}</div><p class="warn">Record cabinet layout dimensions after accounting for finished drywall thickness. Confirm whether any measurements are rough framing dimensions.</p></div>`}
else if(section==='Rooms'){const r=data.rooms.find(x=>x.id===roomId)||data.rooms[0];if(!r){data.rooms.push(newRoom());roomId=data.rooms[0].id;return render()}const idx=data.rooms.indexOf(r);const f=(k,l,t='text',h='')=>field('rooms.'+idx+'.'+k,l,t,h);html=`<div class="panel"><h2>Room-by-Room Measurements</h2><p class="muted">Add as many rooms, walls, openings, and cabinet runs as needed. Enter all dimensions in inches; fractions such as 96 1/2 are supported as text.</p><div class="roomtab no-print">${data.rooms.map(x=>`<button class="${x.id===r.id?'selected':''}" onclick="selectRoom('${x.id}')">${esc(x.name)}</button>`).join('')}<button onclick="addRoom()">+ Add room</button></div><div class="grid">${f('name','Room name')}${f('floor','Floor / level')}${f('ceiling','Finished ceiling height (in)')}${f('flooring','Finished flooring material')}${f('floorThickness','Flooring thickness (in)')}${f('drywall','Drywall thickness (in)')}${f('wallFinish','Wall finish / paneling')}${f('wallPlumb','Wall level/plumb observations')}</div><h3>Cabinet Visibility</h3><div class="metric"><p class="muted">Check any cabinet surfaces that will be visible after installation.</p><label style="display:flex;align-items:center;gap:10px;font-size:16px"><input type="checkbox" style="width:23px;height:23px" data-check="rooms.${idx}.cabinetTopVisible" ${r.cabinetTopVisible?'checked':''}> Top of cabinets visible</label><label style="display:flex;align-items:center;gap:10px;font-size:16px"><input type="checkbox" style="width:23px;height:23px" data-check="rooms.${idx}.cabinetBottomVisible" ${r.cabinetBottomVisible?'checked':''}> Bottom of cabinets visible</label>${f('visibilityNotes','Cabinet visibility notes / finish requirements','textarea')}</div><h3>Walls</h3>${r.walls.map((w,i)=>`<div class="metric"><div class="grid3">${f('walls.'+i+'.name','Elevation ID')}${f('walls.'+i+'.length','Finished length (in)')}${f('walls.'+i+'.height','Height (in)')}</div>${f('walls.'+i+'.notes','Notes / out-of-square / obstructions','textarea')}<button class="smallbtn secondary no-print" onclick="removeEntry('walls',${i})">Remove wall</button></div>`).join('')}<div class="actions no-print"><button onclick="addEntry('walls')">+ Add wall</button></div><h3>Windows, Doors & Openings</h3>${r.openings.map((o,i)=>`<div class="metric"><div class="grid3">${f('openings.'+i+'.type','Type / location')}${f('openings.'+i+'.width','Width (in)')}${f('openings.'+i+'.height','Height (in)')}${f('openings.'+i+'.offset','Offset from corner (in)')}${f('openings.'+i+'.sill','Sill / header height (in)')}</div>${f('openings.'+i+'.notes','Trim and clearance notes','textarea')}<button class="smallbtn secondary no-print" onclick="removeEntry('openings',${i})">Remove opening</button></div>`).join('')}<div class="actions no-print"><button onclick="addEntry('openings')">+ Add opening</button></div><h3>Cabinet Runs / Millwork Areas</h3>${r.cabinetRuns.map((c,i)=>`<div class="metric"><div class="grid3">${f('cabinetRuns.'+i+'.name','Run / elevation')}${f('cabinetRuns.'+i+'.width','Available width (in)')}${f('cabinetRuns.'+i+'.depth','Available depth (in)')}${f('cabinetRuns.'+i+'.height','Available height (in)')}</div>${f('cabinetRuns.'+i+'.notes','Appliances, utilities, fillers, scribes, tolerances','textarea')}<button class="smallbtn secondary no-print" onclick="removeEntry('cabinetRuns',${i})">Remove run</button></div>`).join('')}<div class="actions no-print"><button onclick="addEntry('cabinetRuns')">+ Add cabinet run</button></div>${f('notes','Room notes / measurements to verify','textarea')}${photos(r.photos,'room',r.id)}<div class="actions no-print"><button class="secondary" onclick="deleteRoom()">Delete this room</button></div></div>`}
else if(section==='Open Items'){html=`<div class="panel"><h2>Open Items & Builder Questions</h2><p class="muted">Track unresolved site conditions and assign follow-ups before shop drawings or production.</p>${data.issues.map((it,i)=>`<div class="metric"><div class="grid">${field('issues.'+i+'.title','Issue / required confirmation')}${field('issues.'+i+'.room','Room / location')}${field('issues.'+i+'.owner','Responsible party')}${field('issues.'+i+'.status','Status (Open / Resolved)')}</div>${field('issues.'+i+'.notes','Details / next step','textarea')}${photos(it.photos,'issue',it.id)}<button class="smallbtn secondary no-print" onclick="removeIssue(${i})">Remove issue</button></div>`).join('')}<div class="actions no-print"><button onclick="addIssue()">+ Add open item</button></div></div>`}
else{const missing=checklist.filter(q=>!data.answers[q[0]]).map(q=>q[1]);html=`<div class="panel"><h2>Field Survey Review</h2><p class="muted">Confirm completeness, export a backup, and print a report for design and production.</p><div class="grid3"><div class="metric"><strong>${data.rooms.length}</strong><div>Rooms</div></div><div class="metric"><strong>${checklist.length-missing.length}/${checklist.length}</strong><div>Checklist answers</div></div><div class="metric"><strong>${data.issues.filter(i=>(i.status||'Open').toLowerCase()!=='resolved').length}</strong><div>Open items</div></div></div>${missing.length?`<div class="warn"><b>Unanswered checklist questions:</b><ul>${missing.map(m=>`<li>${esc(m)}</li>`).join('')}</ul></div>`:'<p class="good">All checklist questions have an answer.</p>'}<h3>Rooms</h3><ul>${data.rooms.map(r=>`<li><b>${esc(r.name)}</b> — ${r.walls.length} walls, ${r.openings.length} openings, ${r.cabinetRuns.length} cabinet runs, ${r.photos.length} photos</li>`).join('')}</ul><h3>Outstanding items</h3><ul>${data.issues.map(i=>`<li>${esc(i.title||'Untitled issue')} — ${esc(i.status||'Open')}</li>`).join('')||'<li>None entered</li>'}</ul><div class="actions no-print"><button onclick="exportJSON()">Download project backup (.json)</button><button onclick="saveAsProject()">Save As…</button><button onclick="newBlankProject()">New Blank Project</button><button onclick="printReport()">Print / Save PDF</button><button class="secondary" onclick="document.getElementById('import').click()">Import project backup</button><input id="import" class="hidden" type="file" accept="application/json" onchange="importJSON(event)"></div><p class="warn">This version saves data on this iPad/browser only. Export the JSON backup regularly. Photos are compressed to conserve storage. This is a field documentation tool, not a substitute for signed-off shop drawings or independent dimensional verification.</p></div>`}
 document.getElementById('main').innerHTML=html+`<div class="footer">Earthwoods Field Measure • Version 7 • Local browser storage • No cloud sync</div>`;document.querySelectorAll('[data-path]').forEach(el=>el.addEventListener('input',e=>set(e.target.dataset.path,e.target.value)));document.querySelectorAll('[data-check]').forEach(el=>el.addEventListener('change',e=>set(e.target.dataset.check,e.target.checked)))}
function go(s){section=s;render();window.scrollTo(0,0)}function selectRoom(id){roomId=id;render()}function addRoom(){const r=newRoom();data.rooms.push(r);roomId=r.id;save();render()}function deleteRoom(){if(data.rooms.length===1)return alert('At least one room is required');if(confirm('Delete this room and its measurements?')){data.rooms=data.rooms.filter(r=>r.id!==roomId);roomId=data.rooms[0].id;save();render()}}function addEntry(k){let r=data.rooms.find(r=>r.id===roomId);r[k].push(k==='walls'?{name:String.fromCharCode(65+r.walls.length),length:'',height:'',notes:''}:k==='openings'?{type:'',width:'',height:'',offset:'',sill:'',notes:''}:{name:'Run '+(r.cabinetRuns.length+1),width:'',depth:'',height:'',notes:''});save();render()}function removeEntry(k,i){data.rooms.find(r=>r.id===roomId)[k].splice(i,1);save();render()}function addIssue(){data.issues.push({id:makeId(),title:'',room:'',owner:'',status:'Open',notes:'',photos:[]});save();render()}function removeIssue(i){data.issues.splice(i,1);save();render()}function exportJSON(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(data.project.name||'Earthwoods_Field_Measure').replace(/[^a-z0-9_-]/gi,'_')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}function importJSON(e){const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);if(!obj.project||!Array.isArray(obj.rooms))throw Error('Invalid backup');if(confirm('Replace current local project with this backup?')){data=obj;roomId=data.rooms[0]?.id;save();render()}}catch(err){alert('Could not load project: '+err.message)}};reader.readAsText(f)}function printReport(){let prev=section;section='Review';render();let report=document.createElement('div');report.id='printReport';report.className='panel';let p=data.project;report.innerHTML=`<h2>Earthwoods Field Measure Report</h2><p><b>${esc(p.name)}</b> • ${esc(p.address)} • ${esc(p.date)}<br>Measurer: ${esc(p.measurer)} • Contact: ${esc(p.contact)}</p>${sections.slice(0,3).map(s=>`<h3>${s}</h3>${checklist.filter(q=>q[2]===s).map(q=>`<p><b>${esc(q[1])}</b> ${esc(data.answers[q[0]]||'Not answered')} ${esc(data.details[q[0]]||'')}</p>`).join('')}`).join('')}<h3>Site details</h3>${Object.entries(data.details).filter(([k])=>!checklist.some(q=>q[0]===k)).map(([k,v])=>`<p><b>${esc(k)}:</b> ${esc(v)}</p>`).join('')}${data.rooms.map(r=>`<h3>Room: ${esc(r.name)}</h3><p>Level ${esc(r.floor)} • Ceiling ${esc(r.ceiling)} in • Floor ${esc(r.flooring)} (${esc(r.floorThickness)} in) • Drywall ${esc(r.drywall)} in</p><p><b>Cabinet top visible:</b> ${r.cabinetTopVisible?'Yes':'No'} • <b>Cabinet bottom visible:</b> ${r.cabinetBottomVisible?'Yes':'No'} • ${esc(r.visibilityNotes||'')}</p><p><b>Walls:</b> ${r.walls.map(w=>`${esc(w.name)} ${esc(w.length)} × ${esc(w.height)} in (${esc(w.notes)})`).join('; ')}</p><p><b>Openings:</b> ${r.openings.map(o=>`${esc(o.type)} ${esc(o.width)} × ${esc(o.height)} in, offset ${esc(o.offset)}, sill/header ${esc(o.sill)}`).join('; ')}</p><p><b>Cabinet runs:</b> ${r.cabinetRuns.map(c=>`${esc(c.name)} ${esc(c.width)} W × ${esc(c.depth)} D × ${esc(c.height)} H in (${esc(c.notes)})`).join('; ')}</p><p>${esc(r.notes)}</p>${r.photos.map(ph=>`<img src="${ph.src}" style="width:150px;margin:4px">`).join('')}`).join('')}<h3>Open items</h3>${data.issues.map(i=>`<p>${esc(i.title)} • ${esc(i.room)} • ${esc(i.owner)} • ${esc(i.status)} • ${esc(i.notes)}</p>`).join('')}${checklist.map(q=>(data.questionPhotos?.[q[0]]||[]).map(ph=>`<div><small>${esc(q[1])}</small><br><img src="${ph.src}" style="width:150px;margin:4px"></div>`).join('')).join('')}${data.photos.map(ph=>`<img src="${ph.src}" style="width:150px;margin:4px">`).join('')}`;document.getElementById('main').appendChild(report);window.print();setTimeout(()=>{report.remove();section=prev;render()},600)}
let cameraStream=null,cameraTarget=null,cameraFacing="environment",cameraDeviceId=null;
async function openCamera(kind,id){
 cameraTarget={kind,id};
 if(!navigator.mediaDevices?.getUserMedia){
   alert('This browser cannot access the webcam from this page. Try opening the app from an HTTPS website or localhost in Chrome or Edge. You can still use Upload Photos.');return;
 }
 const overlay=document.createElement('div');overlay.id='ew-camera-overlay';
 overlay.style.cssText='position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;padding:18px';
 overlay.innerHTML='<div style="width:min(780px,100%);background:white;border-radius:15px;padding:18px;color:#21332d"><h2 style="margin:0 0 10px">Take Photo</h2><video id="ew-camera-video" autoplay playsinline muted style="width:100%;max-height:65vh;object-fit:contain;background:#18201c;border-radius:10px"></video><p id="ew-camera-message" class="muted">Requesting camera access…</p><div class="actions"><button type="button" class="primary" id="ew-capture" onclick="captureCameraPhoto()" disabled>📸 Capture Photo</button><button type="button" class="secondary" id="ew-flip" onclick="flipCamera()">🔄 Flip Camera</button><button type="button" class="secondary" onclick="closeCamera()">Cancel</button></div></div>';
 document.body.appendChild(overlay);
 await startCamera();
}
async function startCamera(){
 const video=document.getElementById('ew-camera-video');if(!video)return;
 const capture=document.getElementById('ew-capture');capture.disabled=true;
 const message=document.getElementById('ew-camera-message');message.textContent='Switching camera…';
 if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null;video.srcObject=null;}
 try{
  const constraint=cameraDeviceId?{deviceId:{exact:cameraDeviceId}}:{facingMode:{ideal:cameraFacing}};
  cameraStream=await navigator.mediaDevices.getUserMedia({video:constraint,audio:false});
  if(!document.getElementById('ew-camera-video')){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null;return;}
  video.srcObject=cameraStream;await video.play();capture.disabled=false;
  message.textContent='Camera ready. Use Flip Camera to switch between front and back cameras (or connected webcams).';
 }catch(err){
  message.textContent='Unable to open this camera: '+err.message+'. Try Flip Camera or Upload Photos.';
 }
}
async function flipCamera(){
 const btn=document.getElementById('ew-flip');if(btn)btn.disabled=true;
 try{
  const devices=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');
  const activeId=cameraStream?.getVideoTracks()[0]?.getSettings().deviceId;
  if(devices.length>1){
   const i=devices.findIndex(d=>d.deviceId===activeId);
   cameraDeviceId=devices[(i+1)%devices.length].deviceId;
  }else{
   cameraDeviceId=null;cameraFacing=cameraFacing==='environment'?'user':'environment';
  }
  await startCamera();
  if(devices.length<=1){const m=document.getElementById('ew-camera-message');if(m)m.textContent+=' Only one camera was detected; this device may not support switching.';}
 }catch(err){const m=document.getElementById('ew-camera-message');if(m)m.textContent='Could not switch camera: '+err.message;}
 finally{if(btn)btn.disabled=false;}
}
function captureCameraPhoto(){
 const v=document.getElementById('ew-camera-video');if(!v||!v.videoWidth||!cameraTarget)return;
 const ratio=Math.min(1,1280/Math.max(v.videoWidth,v.videoHeight));
 const c=document.createElement('canvas');c.width=Math.round(v.videoWidth*ratio);c.height=Math.round(v.videoHeight*ratio);
 c.getContext('2d').drawImage(v,0,0,c.width,c.height);
 const src=c.toDataURL('image/jpeg',.72);
 photoList(cameraTarget.kind,cameraTarget.id).push({name:'Camera photo '+new Date().toLocaleString(),src});
 save();closeCamera();render();
}
function closeCamera(){if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}document.getElementById('ew-camera-overlay')?.remove();cameraTarget=null}

try{render();save()}catch(err){document.getElementById('main').innerHTML='<div class="panel"><h2>Unable to load project</h2><p>'+String(err.message).replace(/[<>]/g,'')+'</p><p>Your existing data has not been erased. Try opening a fresh copy of this app.</p></div>';console.error(err)}
